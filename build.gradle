plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
    id "net.neoforged.moddev" version "${moddevgradle_version}" apply false
}

subprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven {
            url = "https://maven.fabricmc.net/"
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.architectury.dev/" }
        mavenCentral()
    }

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}-${rootProject.mod_version}-${rootProject.minecraft_version}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = Integer.parseInt(rootProject.java_version)
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = ""
    }
}
