plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}
subprojects {
    ext.targetSpec = gradle.ext.selectedTargets.find { it.id == project.name }
}
tasks.register('listTargets') {
    group = 'help'
    description = 'Lists selected loader / Minecraft build targets.'
    doLast {
        gradle.ext.selectedTargets.each { println "${it.id.padRight(24)} Minecraft ${it.minecraftRange}, Java ${it.java}" }
    }
}
tasks.register('buildAndGather', Sync) {
    group = 'build'
    description = 'Builds selected targets and gathers distributable jars into build/libs.'
    into layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
subprojects { target ->
    afterEvaluate {
        def spec = target.targetSpec
        def distribution = target.tasks.named(spec.loader == 'fabric' && spec.mc < 260100 ? 'remapJar' : 'jar')
        rootProject.tasks.named('buildAndGather') {
            dependsOn target.tasks.named('build')
            from distribution.flatMap { it.archiveFile }
        }
    }
}
tasks.named('build') { dependsOn 'buildAndGather' }
tasks.named('clean') { dependsOn subprojects.collect { "${it.path}:clean" } }
