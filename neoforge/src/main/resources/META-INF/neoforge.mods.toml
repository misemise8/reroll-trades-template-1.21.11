modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/misemise/reroll-trades/issues"

[[mods]]
modId = "reroll_trades"
version = "${version}"
displayName = "Reroll Trades"
authors = "misemise"
description = '''
Reroll villager trades with a button or keybind (R). Free rerolls, no emerald cost!
'''
logoFile = "assets/reroll-trades/icon.png"

[[mixins]]
config = "reroll-trades.mixins.json"

[[mixins]]
config = "reroll-trades.client-mixins.json"

[[dependencies.reroll_trades]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.reroll_trades]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
